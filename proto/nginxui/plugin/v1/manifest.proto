syntax = "proto3";

package nginxui.plugin.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/nginxui/plugin-spec/gen/go/nginxui/plugin/v1;pluginv1";

// Manifest is plugin.json, see spec/01-manifest.md. Its protobuf JSON mapping
// with proto field names is the file format. schema/plugin.schema.json adds
// the validation rules on top and is checked against this message.
message Manifest {
  // Reverse domain plugin id, e.g. "com.nginxui.dns01".
  string id = 1;
  string name = 2;
  // Semantic version of the plugin.
  string version = 3;
  string description = 4;
  string homepage_url = 5;
  // Package relative path of the icon.
  string icon_path = 6;
  // Protocol major version the plugin targets.
  int32 api_version = 7;
  // Lowest host version the plugin supports.
  string min_nginx_ui_version = 8;

  // How to start the plugin process. Absent for process-less plugins.
  ManifestServer server = 9;
  // Optional browser bundle.
  ManifestWebapp webapp = 10;
  // Process-less contributions.
  ManifestContent content = 11;

  // Capabilities the plugin implements, e.g. "dns01".
  repeated string capabilities = 12;
  // Permissions the plugin requests, e.g. "kv" or "credentials.read:dns".
  repeated string permissions = 13;
  // Hard dependencies on other plugins.
  repeated ManifestRequirement requires = 14;
  // Capabilities some installed plugin must provide.
  repeated string requires_capabilities = 15;
  // Event types delivered through events.on.
  repeated string events = 16;
  // Host scheduled tasks.
  repeated ManifestCron cron = 17;
  // Hosts the plugin talks to, shown to the person before install.
  repeated string network_hosts = 18;

  // Metadata of the dns01 capability.
  ManifestDNS01 dns01 = 19;
  // Metadata of the http capability.
  ManifestHTTP http = 20;
  // Drives the auto-rendered settings form.
  SettingsSchema settings_schema = 21;
  // Metadata of the notify capability.
  ManifestNotify notify = 22;
  // Metadata of the probe capability.
  ManifestProbe probe = 23;
  // Metadata of the mcp capability.
  ManifestMCP mcp = 24;
  // Metadata of the storage capability.
  ManifestStorage storage = 25;
  // Metadata of the cert.deploy capability.
  ManifestDeploy deploy = 26;
  // Metadata of the security.blocklist capability.
  ManifestBlocklist blocklist = 27;
  // Metadata of the upstream.discovery capability.
  ManifestDiscovery discovery = 28;
  // Tuning of the log.sink capability.
  ManifestLogSink log_sink = 29;
  // Translations of name and description keyed by host locale code, e.g.
  // "zh_CN". name and description stay the fallback.
  map<string, ManifestI18n> i18n = 30;
}

// ManifestI18n translates the display fields of a manifest into one
// language. An empty string means no translation for that field.
message ManifestI18n {
  string name = 1;
  string description = 2;
}

// ManifestServer describes how to start the plugin process.
message ManifestServer {
  // Maps "<goos>-<goarch>" to a package relative executable path.
  map<string, string> executables = 1;
  // Fallback argv for interpreted plugins.
  repeated string command = 2;
  // "resident" (default) or "on_demand".
  string lifecycle = 3;
  // Idle time after which an on_demand process is stopped.
  int32 idle_timeout_seconds = 4;
  // Resource hints of the process, applied by a host that confines plugin
  // processes and capped by its own limits.
  ManifestResources resources = 5;
}

// ManifestResources are the resources a plugin process needs at most. A host
// that confines plugin processes applies the smaller of a hint and its own
// limit; a hint never raises a limit. See spec/04-lifecycle.md LIFE-16.
message ManifestResources {
  // Memory in MiB. 0 means no hint.
  int32 memory_mb = 1;
  // CPU time in percent of one core, 100 being one core. 0 means no hint.
  int32 cpu_percent = 2;
}

// ManifestWebapp describes the optional browser bundle.
message ManifestWebapp {
  string bundle_path = 1;
  string style_path = 2;
  // Maps a shared runtime library to the semver range the bundle was built
  // against.
  map<string, string> shared = 3;
  // Zero-build iframe pages.
  repeated ManifestPage pages = 4;
}

// ManifestPage is a zero-build iframe page.
message ManifestPage {
  string path = 1;
  // Page title keyed by locale.
  map<string, string> title = 2;
  string icon = 3;
  // Package relative HTML file.
  string file = 4;
}

// ManifestContent declares process-less contributions. See
// spec/17-content-plugins.md.
message ManifestContent {
  // Package relative directory holding conf/ and block/ config templates.
  string templates = 1;
  // Package relative directory holding <lang>.po translation files.
  string locales = 2;
}

// ManifestRequirement is a hard dependency on another plugin.
message ManifestRequirement {
  string id = 1;
  // Semver range. Empty accepts any version.
  string version = 2;
}

// ManifestCron is a host scheduled task.
message ManifestCron {
  string id = 1;
  // Five-field cron expression or "@every <duration>".
  string schedule = 2;
  // Plugin method the host invokes when the schedule fires.
  string method = 3;
}

// ManifestDNS01 is the metadata block of the dns01 capability.
message ManifestDNS01 {
  repeated DNS01Provider providers = 1;
}

// DNS01Provider describes one vendor a plugin can solve DNS-01 for.
message DNS01Provider {
  reserved 3;
  reserved "configuration";

  string name = 1;
  // Vendor code, shared across every installed dns01 plugin.
  string code = 2;
  DNS01ProviderLinks links = 4;
  // Default used when the plugin does not implement dns01.options.
  int32 propagation_timeout_seconds = 5;
  // Default used when the plugin does not implement dns01.options.
  int32 polling_interval_seconds = 6;
  // Credential form, see DNS01-14. Required.
  DNS01ProviderForm form = 7;
}

// DNS01ProviderLinks points at vendor documentation.
message DNS01ProviderLinks {
  reserved 2;
  reserved "go_client";

  string api = 1;
}

// DNS01ProviderForm describes how a host lays out the credential form.
message DNS01ProviderForm {
  // Fields in display order.
  repeated DNS01ProviderField fields = 1;
  // Ways to sign in, present only when there is more than one.
  repeated DNS01ProviderMethod methods = 2;
}

// DNS01ProviderField is one input of the credential form.
message DNS01ProviderField {
  // Config key the value is stored and sent under.
  string key = 1;
  // Short plain English label, a gettext msgid.
  string label = 2;
  // Optional plain English sentence, a gettext msgid.
  string help = 3;
  // "credential" or "setting".
  string group = 4;
  bool optional = 5;
  // Rendered as a password input.
  bool secret = 6;
  // Value used when the field is left empty, shown as a placeholder.
  string default = 7;
  // "seconds" or empty.
  string unit = 8;
  // Documentation URL for the field.
  string link = 9;
}

// DNS01ProviderMethod is one way to sign in to the vendor.
message DNS01ProviderMethod {
  // Plain English name, a gettext msgid.
  string name = 1;
  bool recommended = 2;
  // Credential field keys this method uses. May be empty.
  repeated string fields = 3;
  // Fixed config values the host stores while this method is chosen.
  map<string, string> values = 4;
}

// ManifestHTTP is the metadata block of the http capability.
message ManifestHTTP {
  // "unix" (reverse proxy to a socket) or "rpc" (http.handle fallback).
  string listen = 1;
}

// ManifestNotify is the metadata block of the notify capability.
message ManifestNotify {
  repeated NotifyChannel channels = 1;
}

// NotifyChannel describes one vendor channel a plugin delivers notifications
// through.
message NotifyChannel {
  // Channel code, shared across every installed notify plugin.
  string code = 1;
  string name = 2;
  // Fields of the channel form.
  ConfigurationSchema configuration = 3;
}

// ManifestProbe is the metadata block of the probe capability.
message ManifestProbe {
  repeated ProbeKind kinds = 1;
}

// ProbeKind describes one way a plugin can check the health of a target.
message ProbeKind {
  // Kind code, shared across every installed probe plugin.
  string code = 1;
  string name = 2;
  // Fields of the probe form.
  ConfigurationSchema configuration = 3;
}

// ManifestStorage is the metadata block of the storage capability.
message ManifestStorage {
  repeated StorageBackend backends = 1;
}

// StorageBackend describes one place a plugin can keep host files.
message StorageBackend {
  // Backend code, shared across every installed storage plugin.
  string code = 1;
  string name = 2;
  // Fields of the backend form.
  ConfigurationSchema configuration = 3;
}

// ManifestDeploy is the metadata block of the cert.deploy capability.
message ManifestDeploy {
  repeated DeployTarget targets = 1;
}

// DeployTarget describes one kind of external target a plugin can push
// certificates to.
message DeployTarget {
  // Target kind code, shared across every installed cert.deploy plugin.
  string code = 1;
  string name = 2;
  // Fields of the target form.
  ConfigurationSchema configuration = 3;
}

// ManifestBlocklist is the metadata block of the security.blocklist
// capability.
message ManifestBlocklist {
  repeated BlocklistSource sources = 1;
}

// BlocklistSource describes one kind of source a plugin can fetch a list of
// addresses to deny from.
message BlocklistSource {
  // Source kind code, shared across every installed security.blocklist
  // plugin.
  string code = 1;
  string name = 2;
  // Fields of the source form.
  ConfigurationSchema configuration = 3;
  // Default refresh interval of a source of this kind. 0 means 3600, a
  // value below 60 is invalid.
  int32 refresh_seconds = 4;
}

// ManifestDiscovery is the metadata block of the upstream.discovery
// capability.
message ManifestDiscovery {
  repeated DiscoveryProvider providers = 1;
}

// DiscoveryProvider describes one place a plugin can resolve services from.
message DiscoveryProvider {
  // Provider code, shared across every installed upstream.discovery plugin.
  string code = 1;
  string name = 2;
  // Fields of the provider form.
  ConfigurationSchema configuration = 3;
}

// ManifestLogSink tunes the log.sink capability. Every field is optional.
message ManifestLogSink {
  // Most entries the host sends in one log.push stream. 0 means 256, at most
  // 4096.
  int32 batch_size = 1;
  // Longest time in milliseconds the host keeps a log.push stream open once
  // its first entry was sent. 0 means 500, at least 50.
  int32 flush_interval_ms = 2;
  // Formats of the lines the plugin wants, "combined" or "raw". Empty means
  // every line.
  repeated string formats = 3;
}

// ConfigurationSchema drives the form of a notify channel, a probe kind, a
// storage backend, a deploy target, a blocklist source or a discovery
// provider. The values travel as a map of strings.
message ConfigurationSchema {
  repeated ConfigurationField fields = 1;
}

// ConfigurationField is one entry of ConfigurationSchema.
message ConfigurationField {
  // Key of the value in the config map.
  string key = 1;
  // One of "text" (default), "textarea", "number", "bool".
  string type = 2;
  string display_name = 3;
  string help_text = 4;
  bool required = 5;
  // The value is a credential: masked in forms and never logged.
  bool secret = 6;
}

// ManifestMCP is the metadata block of the mcp capability.
message ManifestMCP {
  repeated MCPTool tools = 1;
}

// MCPTool describes one Model Context Protocol tool a plugin serves.
message MCPTool {
  // Tool name, unique within the plugin. The host publishes it with a prefix
  // derived from the plugin id.
  string name = 1;
  string description = 2;
  // JSON Schema of the arguments object. Absent means no arguments.
  google.protobuf.Struct input_schema = 3;
}

// SettingsSchema drives the auto-rendered settings form.
message SettingsSchema {
  string header = 1;
  string footer = 2;
  repeated SettingsField settings = 3;
}

// SettingsField is one entry of SettingsSchema.
message SettingsField {
  string key = 1;
  // One of "text", "bool", "number", "select", "secret", "textarea".
  string type = 2;
  string display_name = 3;
  string help_text = 4;
  // Default value. Any JSON value matching type.
  google.protobuf.Value default = 5;
  // Choices of a select field.
  repeated SettingsOption options = 6;
  bool required = 7;
}

// SettingsOption is a choice of a select field.
message SettingsOption {
  string value = 1;
  string label = 2;
}
