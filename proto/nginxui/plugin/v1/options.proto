syntax = "proto3";

package nginxui.plugin.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/nginxui/plugin-spec/gen/go/nginxui/plugin/v1;pluginv1";

// Method options that bind every rpc of this package to the stdio JSON-RPC
// transport. The numbers sit in the 50000-99999 range protobuf reserves for
// organization-internal extensions.
extend google.protobuf.MethodOptions {
  // JSON-RPC method name of the rpc on the stdio transport, e.g.
  // "dns01.present". Every rpc of this package MUST set it and the names MUST
  // be unique across the package.
  string rpc_name = 52101;

  // Marks a one-way message. On the stdio transport it is sent as a JSON-RPC
  // notification (no id) and MUST NOT be answered. On gRPC it stays a unary
  // call whose empty response the caller ignores.
  bool notification = 52102;

  // Marks a client streaming rpc: the caller sends any number of request
  // messages and the callee answers once, with the response message, after
  // the stream ended. Such an rpc has no JSON-RPC form. It travels on gRPC
  // only and a peer answers -32601 for its rpc_name on stdio. The rpc must
  // also be declared with a streamed request in the proto.
  bool streaming = 52103;
}
